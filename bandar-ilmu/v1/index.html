<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandar Ilmu</title>
<style>
:root{
  --bg:#20331f; --panel:#fffaf0; --panel2:#f6ecd9; --ink:#2b2118; --muted:#7a6a58;
  --accent:#e07a2e; --accent-ink:#fff; --good:#2f8f5b; --bad:#c0392b; --line:#e3d4b8; --gold:#f2b632;
  --shadow:0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none}
canvas#map{position:fixed;inset:0;display:block;cursor:grab}
canvas#map.dragging{cursor:grabbing}
canvas#map.building{cursor:crosshair}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.hidden{display:none!important}
.zh{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}

/* HUD */
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:stretch;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.chip{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:6px 12px;display:flex;align-items:center;gap:10px}
#who .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
#who .nm{font-weight:700;line-height:1.1}
#who .tt{font-size:12px;color:var(--muted)}
#res{flex:1;justify-content:center;gap:18px;flex-wrap:wrap}
.r{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
.r small{font-weight:400;color:var(--muted);font-size:12px}
#clockChip{gap:8px}
#clockChip .big{font-weight:700;font-size:17px;line-height:1.1}
#clockChip small{color:var(--muted);font-size:12px}
.hbtn{background:var(--panel2);padding:6px 10px;font-size:15px}
.hbtn:hover{background:#efe0c4}
#goalChip{position:fixed;top:66px;left:8px;max-width:320px;z-index:4;flex-direction:column;align-items:stretch;gap:4px;font-size:13px;cursor:pointer}
#goalChip b{font-size:13px}
.bar{height:7px;border-radius:4px;background:#eadcc2;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}

/* build bar */
#buildBar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;
  background:var(--panel);padding:6px;border-radius:16px;box-shadow:var(--shadow);max-width:calc(100vw - 16px);overflow-x:auto}
.bcard{background:var(--panel2);min-width:78px;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;position:relative}
.bcard .ic{font-size:24px;line-height:1.1}
.bcard .zh{font-size:15px;font-weight:700}
.bcard .cost{color:var(--muted)}
.bcard.sel{outline:3px solid var(--accent);background:#ffe9d2}
.bcard[disabled]{opacity:.5;cursor:not-allowed}
.bcard .lock{position:absolute;top:2px;right:4px;font-size:11px}
#tip{position:fixed;z-index:6;background:rgba(32,24,16,.92);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;pointer-events:none;max-width:260px}
#tip .zh{font-size:18px}
#toasts{position:fixed;top:72px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:40;align-items:flex-end}
.toast{background:var(--panel);border-left:5px solid var(--accent);padding:8px 12px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:340px;animation:tin .25s ease}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}

/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(10,14,8,.55);display:grid;place-items:center;z-index:30;padding:16px}
#modal{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 22px}
#modal h2{margin:0 0 8px;font-size:21px;display:flex;align-items:center;gap:8px}
#modal h2 .ic{font-size:28px}
.qzh{font-size:25px;line-height:1.7;margin:6px 0 10px;padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:12px}
.qzh .w{border-bottom:2px dotted var(--accent);cursor:pointer}
.qzh .w:hover{background:#ffe9d2}
.say{background:var(--panel2);font-size:18px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.hint{background:#fff6dc;border:1px dashed #d9b75a;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.5}
.hint .gl{display:inline-block;margin:2px 8px 2px 0;font-size:14px}
.ansRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:18px}
.ansRow input{font:inherit;font-size:24px;width:110px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;text-align:center}
.ansRow input.sm{width:80px}
.ansRow input:focus{outline:none;border-color:var(--accent)}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--panel2);padding:9px 16px;font-size:16px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:#fff}
.btn:hover{filter:brightness(.96)}
.fb{min-height:26px;font-size:17px;font-weight:600;margin-top:4px}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.sol{background:#eef7f1;border:1px solid #b9dcc6;border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.6;margin-top:6px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice .btn{font-size:20px;min-width:90px}
.visual{display:flex;justify-content:center;margin:6px 0}
.blocks{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.bgrp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.bgrp .row{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;max-width:260px;justify-content:center}
.blk-th{width:34px;height:34px;background:#8e5bd3;border-radius:4px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.blk-h{width:30px;height:30px;background:repeating-linear-gradient(0deg,#e07a2e 0 2px,#f4a25e 2px 3px),#f4a25e;border-radius:3px}
.blk-t{width:7px;height:30px;background:#2f8f5b;border-radius:2px}
.blk-o{width:7px;height:7px;background:#3b7dd8;border-radius:2px}

/* screens */
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
  background:radial-gradient(circle at 50% 30%,#4b7a3e,#20331f 70%)}
.titleBox{text-align:center;color:#fff}
.titleBox h1{font-size:52px;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.titleBox .sub{font-size:22px;opacity:.9;margin-bottom:24px}
.profiles{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.pcard{background:var(--panel);color:var(--ink);border-radius:20px;padding:20px 26px;width:230px;box-shadow:var(--shadow);text-align:center;transition:transform .12s}
.pcard:hover{transform:translateY(-4px)}
.pcard .av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:38px;color:#fff;font-weight:800}
.pcard .nm{font-size:24px;font-weight:800}
.pcard .tt{color:var(--muted);font-size:14px;min-height:20px}
.foot{margin-top:22px;display:flex;gap:10px;justify-content:center}
.foot .btn{background:rgba(255,255,255,.15);color:#fff}

table.rep{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
table.rep th,table.rep td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.mbar{display:inline-block;width:80px;height:9px;border-radius:5px;background:#eadcc2;overflow:hidden;vertical-align:middle}
.mbar i{display:block;height:100%}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .btn.on{background:var(--accent);color:#fff}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.wcard .zh{font-size:28px;font-weight:700}
.wcard .py{color:var(--accent);font-size:13px}
.wcard .bm{font-size:13px;color:var(--muted)}
.wcard.locked{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.sumGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.sumGrid div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.sumGrid b{display:block;font-size:26px}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="hidden">
  <div class="chip" id="who"><div class="av"></div><div><div class="nm"></div><div class="tt"></div></div></div>
  <div class="chip" id="res"></div>
  <div class="chip" id="clockChip"><canvas id="clockFace" width="44" height="44"></canvas><div><div class="big" id="clockTxt"></div><small id="dayTxt"></small></div>
    <button class="hbtn" id="bBook" title="Buku Kata">📖</button>
    <button class="hbtn" id="bSwitch" title="Tukar pemain">🔁</button>
    <button class="hbtn" id="bPause" title="Rehat">⏸</button>
    <button class="hbtn" id="bHelp" title="Cara main">❓</button>
  </div>
</div>
<div class="chip hidden" id="goalChip"></div>
<div id="buildBar" class="hidden"></div>
<div id="tip" class="hidden"></div>
<div id="toasts"></div>
<div id="modalWrap" class="hidden"><div id="modal"></div></div>
<div id="screen" class="screen"></div>

<script>
'use strict';
/* ============================================================
   Bandar Ilmu v1 — city-builder where the maths runs the town.
   Single file, no server, saves in this browser (localStorage).
   ============================================================ */

/* ---------- Words (also read by scripts/generate_audio.py) ---------- */
const WORDS = /*WORDS-START*/[
{"id":"mianbao","zh":"面包","py":"miànbāo","bm":"roti"},
{"id":"mianfen","zh":"面粉","py":"miànfěn","bm":"tepung"},
{"id":"xiaomai","zh":"小麦","py":"xiǎomài","bm":"gandum"},
{"id":"nongchang","zh":"农场","py":"nóngchǎng","bm":"ladang"},
{"id":"fengche","zh":"风车","py":"fēngchē","bm":"kincir angin"},
{"id":"mianbaodian","zh":"面包店","py":"miànbāodiàn","bm":"kedai roti"},
{"id":"fangzi","zh":"房子","py":"fángzi","bm":"rumah"},
{"id":"cangku","zh":"仓库","py":"cāngkù","bm":"gudang"},
{"id":"shichang","zh":"市场","py":"shìchǎng","bm":"pasar"},
{"id":"qingzhensi","zh":"清真寺","py":"qīngzhēnsì","bm":"masjid"},
{"id":"kache","zh":"卡车","py":"kǎchē","bm":"lori"},
{"id":"tudi","zh":"土地","py":"tǔdì","bm":"tanah"},
{"id":"shu","zh":"树","py":"shù","bm":"pokok"},
{"id":"hua","zh":"花","py":"huā","bm":"bunga"},
{"id":"denglong","zh":"灯笼","py":"dēnglong","bm":"tanglung"},
{"id":"qian","zh":"钱","py":"qián","bm":"duit"},
{"id":"jia","zh":"家","py":"jiā","bm":"keluarga / rumah"},
{"id":"ren","zh":"人","py":"rén","bm":"orang"},
{"id":"yigong","zh":"一共","py":"yígòng","bm":"jumlah semua"},
{"id":"mei","zh":"每","py":"měi","bm":"setiap"},
{"id":"duoshao","zh":"多少","py":"duōshǎo","bm":"berapa"},
{"id":"haiyao","zh":"还要","py":"hái yào","bm":"masih perlu / lagi"},
{"id":"yijing","zh":"已经","py":"yǐjīng","bm":"sudah"},
{"id":"shengchan","zh":"生产","py":"shēngchǎn","bm":"menghasilkan"},
{"id":"dai","zh":"袋","py":"dài","bm":"guni / beg"},
{"id":"xiang","zh":"箱","py":"xiāng","bm":"kotak / peti"},
{"id":"xiaoshi","zh":"小时","py":"xiǎoshí","bm":"jam"},
{"id":"fenzhong","zh":"分钟","py":"fēnzhōng","bm":"minit"},
{"id":"miao","zh":"秒","py":"miǎo","bm":"saat"},
{"id":"tian","zh":"天","py":"tiān","bm":"hari"},
{"id":"kaishi","zh":"开始","py":"kāishǐ","bm":"mula"},
{"id":"jieshu","zh":"结束","py":"jiéshù","bm":"tamat / habis"},
{"id":"jidian","zh":"几点","py":"jǐ diǎn","bm":"pukul berapa"},
{"id":"duochangshijian","zh":"多长时间","py":"duō cháng shíjiān","bm":"berapa lama"},
{"id":"shangwu","zh":"上午","py":"shàngwǔ","bm":"pagi"},
{"id":"xiawu","zh":"下午","py":"xiàwǔ","bm":"petang"},
{"id":"gewei","zh":"个位","py":"gèwèi","bm":"tempat sa"},
{"id":"shiwei","zh":"十位","py":"shíwèi","bm":"tempat puluh"},
{"id":"baiwei","zh":"百位","py":"bǎiwèi","bm":"tempat ratus"},
{"id":"qianwei","zh":"千位","py":"qiānwèi","bm":"tempat ribu"},
{"id":"shuzi","zh":"数字","py":"shùzì","bm":"digit / nombor"}
]/*WORDS-END*/;
const WORD_BY_ID = Object.fromEntries(WORDS.map(w => [w.id, w]));
const WORDS_BY_LEN = [...WORDS].sort((a, b) => b.zh.length - a.zh.length);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtN = n => n >= 1000 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(n);
function hmOf(min) { min = ((min % 1440) + 1440) % 1440; return { h: Math.floor(min / 60), m: min % 60 }; }
function h12(h) { return ((h + 11) % 12) + 1; }
function fmtClock(min) { const { h, m } = hmOf(min); return `${h12(h)}:${pad2(m)} ${h < 12 ? 'pagi' : (h < 19 ? 'petang' : 'malam')}`; }
function fmtZh(min) { const { h, m } = hmOf(min); return `${h < 12 ? '上午' : h === 12 ? '中午' : '下午'}${h12(h)}:${pad2(m)}`; }
function fmtDur(min) { const h = Math.floor(min / 60), m = min % 60; return [h ? `${h} jam` : '', m || !h ? `${m} minit` : ''].filter(Boolean).join(' '); }
function zhDur(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? `${h}小时` : '') + (m ? `${m}分钟` : '') || '0分钟'; }
function zhNum(n) {
  const d = '零一二三四五六七八九', units = ['', '十', '百', '千'];
  if (n === 0) return '零';
  const s = String(n); let out = '', zero = false;
  for (let i = 0; i < s.length; i++) {
    const c = +s[i], u = s.length - 1 - i;
    if (c === 0) { zero = true; continue; }
    if (zero && out) out += '零';
    zero = false; out += d[c] + units[u];
  }
  if (n >= 10 && n < 20) return out.replace(/^一十/, '十');
  return out.replace(/^二千/, '两千');
}

/* ---------- constants ---------- */
const TS = 40, MAP = 36, PLOT = 6, NP = MAP / PLOT;
const DAY_START = 7 * 60, DAY_END = 19 * 60;
const GAME_MIN_PER_SEC = 0.8;                 // one game day (12 h) ≈ 15 min real time
const ITEMS = {
  wheat: { zh: '小麦', id: 'xiaomai', mw: '袋', bm: 'guni gandum', icon: '🌾', price: 1 },
  flour: { zh: '面粉', id: 'mianfen', mw: '袋', bm: 'guni tepung', icon: '🥣', price: 2 },
  bread: { zh: '面包', id: 'mianbao', mw: '个', bm: 'roti', icon: '🍞', price: 3 },
};
const TYPES = {
  house:     { zh: '房子', w: 2, h: 2, cost: 30, pop: 0, icon: '🏠', bm: 'Rumah', desc: 'Keluarga baru tinggal di sini dan membuat pesanan.' },
  farm:      { zh: '农场', w: 3, h: 3, cost: 20, pop: 0, icon: '🌾', bm: 'Ladang', desc: 'Hasilkan gandum setiap jam.' },
  windmill:  { zh: '风车', w: 2, h: 2, cost: 60, pop: 10, icon: '🌬️', bm: 'Kincir', desc: 'Kisar gandum jadi tepung.' },
  bakery:    { zh: '面包店', w: 3, h: 2, cost: 80, pop: 16, icon: '🍞', bm: 'Kedai roti', desc: 'Bakar tepung jadi roti.' },
  mosque:    { zh: '清真寺', w: 3, h: 3, cost: 200, pop: 30, icon: '🕌', bm: 'Masjid', desc: 'Kebanggaan bandar.' },
  market:    { zh: '市场', w: 3, h: 3, cost: 300, pop: 40, icon: '🏪', bm: 'Pasar', desc: 'Akan datang (v2): jual beli & duit.', soon: true },
  tree:      { zh: '树', w: 1, h: 1, cost: 5, pop: 0, icon: '🌳', bm: 'Pokok', deco: true },
  flower:    { zh: '花', w: 1, h: 1, cost: 5, pop: 0, icon: '🌷', bm: 'Bunga', deco: true },
  lantern:   { zh: '灯笼', w: 1, h: 1, cost: 10, pop: 0, icon: '🏮', bm: 'Tanglung', deco: true },
  warehouse: { zh: '仓库', w: 3, h: 2, cost: 0, pop: 0, icon: '📦', bm: 'Gudang', nobuild: true },
};
const BUILD_ORDER = ['house', 'farm', 'windmill', 'bakery', 'tree', 'flower', 'lantern', 'mosque', 'market'];
const TYPE_WORD = { house: 'fangzi', farm: 'nongchang', windmill: 'fengche', bakery: 'mianbaodian', mosque: 'qingzhensi', market: 'shichang', tree: 'shu', flower: 'hua', lantern: 'denglong', warehouse: 'cangku' };

const SKILLS = [
  { id: 'read_total', bm: 'Baca soalan cerita', zh: '应用题', where: 'Pesanan rumah' },
  { id: 'mul', bm: 'Darab (sifir)', zh: '乘法', where: 'Ladang, beli tanah' },
  { id: 'add', bm: 'Tambah & tolak', zh: '加减', where: 'Beli tanah' },
  { id: 'time_end', bm: 'Pukul berapa siap', zh: '几点结束', where: 'Kincir' },
  { id: 'time_dur', bm: 'Berapa lama (tempoh)', zh: '多长时间', where: 'Kedai roti' },
  { id: 'time_units', bm: 'Unit masa (60 minit = 1 jam)', zh: '时间单位', where: 'Kedai roti' },
  { id: 'place_value', bm: 'Nilai tempat', zh: '数位', where: 'Lori di gudang' },
];
const SKILL_BY_ID = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const START_LEVEL = {
  besar: { read_total: 2, mul: 3, add: 3, time_end: 1, time_dur: 1, time_units: 1, place_value: 2 },
  muda:  { read_total: 1, mul: 1, add: 1, time_end: 1, time_dur: 1, time_units: 1, place_value: 1 },
};
const TITLES = [
  { id: 'datuk', bm: 'Datuk Bandar', zh: '市长', test: p => SKILLS.every(s => mastered(p, s.id)) },
  { id: 'saudagar', bm: 'Saudagar', zh: '商人', test: p => mastered(p, 'read_total') && mastered(p, 'add') },
  { id: 'tukang', bm: 'Tukang Roti', zh: '面包师', test: p => mastered(p, 'time_end') && mastered(p, 'time_dur') && mastered(p, 'time_units') },
  { id: 'petani', bm: 'Petani Pintar', zh: '聪明农夫', test: p => mastered(p, 'mul') },
  { id: 'kerani', bm: 'Kerani Gudang', zh: '仓库管理员', test: p => mastered(p, 'place_value') },
];
const CHAPTERS = [
  { name: 'Kampung Roti', zh: '面包村', goals: [
    { bm: 'Bina kincir 风车', test: t => t.buildings.some(b => b.type === 'windmill') },
    { bm: 'Bina kedai roti 面包店', test: t => t.buildings.some(b => b.type === 'bakery') },
    { bm: 'Penduduk 20 orang', test: t => pop(t) >= 20, prog: t => [pop(t), 20] },
  ] },
  { name: 'Pekan Pintar', zh: '聪明镇', goals: [
    { bm: 'Penduduk 40 orang', test: t => pop(t) >= 40, prog: t => [pop(t), 40] },
    { bm: 'Hantar 150 roti', test: t => t.delivered.bread >= 150, prog: t => [t.delivered.bread, 150] },
    { bm: 'Beli 3 tanah baru', test: t => t.plotsBought >= 3, prog: t => [t.plotsBought, 3] },
  ] },
  { name: 'Bina Pasar Besar', zh: '大市场', soon: true, goals: [
    { bm: 'Akan datang dalam v2: pasar, duit, perdagangan Aflah ↔ Haidar', test: () => false },
  ] },
];

/* ---------- state ---------- */
const SAVE_KEY = 'bandar-ilmu-v1';
let S = null;            // whole save

/* ---------- town queries ---------- */
const T = () => S.town;
const pop = t => t.buildings.filter(b => b.type === 'house').reduce((a, b) => a + (b.res || 0), 0);
const absNow = () => T().day * 1440 + T().minute;
function tier(t) { const p = pop(t); return p < 30 ? { bm: 'Kampung', zh: '村', cap: 3 } : p < 80 ? { bm: 'Pekan', zh: '镇', cap: 4 } : { bm: 'Bandar', zh: '城', cap: 5 }; }
function lvl(sid) { return clamp(P.skills[sid].level, 1, Math.max(tier(T()).cap, START_LEVEL[P.track][sid])); }
function mastered(p, sid) { const k = p.skills[sid]; return k.n >= 8 && k.mastery >= 0.75; }
function titleOf(p) { const t = TITLES.find(x => x.test(p)); return t ? `${t.bm} ${t.zh}` : (p.track === 'besar' ? 'Pembina Muda' : 'Pembantu Bandar'); }
function water(x, y) { const rx = 32 + Math.round(Math.sin(y / 4) * 1.2); return x === rx || x === rx + 1; }
function plotOf(x, y) { return `${Math.floor(x / PLOT)},${Math.floor(y / PLOT)}`; }
function owned(x, y) { return x >= 0 && y >= 0 && x < MAP && y < MAP && !!T().plots[plotOf(x, y)]; }
function buildingAt(x, y) { return T().buildings.find(b => { const ty = TYPES[b.type]; return x >= b.x && x < b.x + ty.w && y >= b.y && y < b.y + ty.h; }); }
function canPlace(type, x, y) {
  const ty = TYPES[type];
  for (let i = 0; i < ty.w; i++) for (let j = 0; j < ty.h; j++) {
    const X = x + i, Y = y + j;
    if (!owned(X, Y) || water(X, Y) || buildingAt(X, Y)) return false;
  }
  return true;
}
function plotBuyable(px, py) {
  if (px < 0 || py < 0 || px >= NP || py >= NP || T().plots[`${px},${py}`]) return false;
  return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => T().plots[`${px + dx},${py + dy}`]);
}

/* ---------- learning model ---------- */
function weight(sid) { const k = P.skills[sid]; return (1 - k.mastery) + 0.15; }
function pickWeighted(ids) { const ws = ids.map(weight); let r = Math.random() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ids.length; i++) { r -= ws[i]; if (r <= 0) return ids[i]; } return ids[ids.length - 1]; }
function recordAttempt(q, res) {
  const k = P.skills[q.skill];
  const credit = res.ok ? (res.hint ? 0.6 : 1) : 0;
  k.n++; k.nAt++; if (res.ok) k.ok++; if (res.hint) k.hint++;
  k.mastery = +(k.mastery * 0.75 + credit * 0.25).toFixed(3);
  k.recent.push(credit); if (k.recent.length > 6) k.recent.shift();
  const last4 = k.recent.slice(-4), mean = last4.reduce((a, b) => a + b, 0) / Math.max(1, last4.length);
  let msg = null;
  if (k.nAt >= 4 && last4.length >= 4 && mean >= 0.8 && k.level < 5) { k.level++; k.nAt = 0; k.recent = []; msg = `⭐ ${SKILL_BY_ID[q.skill].bm} naik ke tahap ${k.level}!`; }
  else if (k.recent.length >= 3 && k.recent.slice(-3).every(c => c === 0) && k.level > 1) { k.level--; k.nAt = 0; k.recent = []; }
  P.stats.asked++; if (res.ok) P.stats.correct++;
  S.log.push({ ts: Date.now(), p: P.id, skill: q.skill, level: q.level, q: q.short || q.zh, ans: q.ansText, given: res.given, ok: res.ok, hint: res.hint, tries: res.tries });
  if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000);
  const ds = T().dayStats; if (ds) { ds.asked++; if (res.ok) ds.correct++; }
  if (msg) toast(msg, 'good');
  save();
}

      zh: `这块土地长${w}米，宽${h}米。每平方米${rate}令吉。这块土地多少钱？`,
      bm: `Tanah ini panjang ${w} m, lebar ${h} m. Harga RM${rate} setiap m². Berapa harga tanah ini?`,
      hint: `Luas = panjang × lebar = ${w} × ${h}.${rate > 1 ? ` Kemudian darab dengan RM${rate}.` : ''}`,
      solution: `${w} × ${h} = ${area} m²${rate > 1 ? `, ${area} × RM${rate} = <b>RM${ans}</b>` : ` → <b>RM${ans}</b>`}`,
      visual: { type: 'rect', w, h }, short: `tanah ${w}×${h} @RM${rate}`, prefix: 'RM' };
  }
  const L = lvl('add');
  let a, b, ans, zh, bm, sol;
  if (L <= 2) { a = 10 * rnd(1, 4) + (L === 2 ? rnd(1, 4) : 0); b = 10 * rnd(1, 3) + (L === 2 ? rnd(1, 5) : 0); ans = a + b; zh = `土地的价钱是${a}令吉加${b}令吉。一共多少钱？`; bm = `Harga tanah RM${a} tambah RM${b}. Berapa semuanya?`; sol = `${a} + ${b} = <b>RM${ans}</b>`; }
  else if (L === 3) { a = rnd(25, 69); b = rnd(15, 39); ans = a + b; zh = `土地的价钱是${a}令吉加${b}令吉。一共多少钱？`; bm = `Harga tanah RM${a} tambah RM${b}. Berapa semuanya?`; sol = `${a} + ${b} = <b>RM${ans}</b>`; }
  else { a = rnd(80, L >= 5 ? 300 : 150); b = rnd(11, a - 30); ans = a - b; zh = `土地原价${a}令吉，便宜了${b}令吉。现在多少钱？`; bm = `Harga asal tanah RM${a}, diskaun RM${b}. Berapa harga sekarang?`; sol = `${a} − ${b} = <b>RM${ans}</b>`; }
  return { skill: 'add', level: L, kind: 'num', answer: ans, ansText: `RM${ans}`, price: ans, zh, bm, hint: `Kira sa dulu, kemudian puluh. Ingat simpan / pinjam.`, solution: sol, short: bm, prefix: 'RM' };
}

function clockSVG(min, size = 120, label = '') {

  return `<div style="text-align:center"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="#fff" stroke="#5a4a38" stroke-width="3"/>${ticks}
  <line x1="${cx}" y1="${cx}" x2="${cx + Math.cos(ha) * r * 0.5}" y2="${cx + Math.sin(ha) * r * 0.5}" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>
  <line x1="${cx}" y1="${cx}" x2="${cx + Math.cos(ma) * r * 0.78}" y2="${cx + Math.sin(ma) * r * 0.78}" stroke="#e07a2e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cx}" r="4" fill="#2b2118"/></svg><div class="muted" style="font-size:13px">${label}</div></div>`;
}

  if (v.type === 'blocks') {

    const g = (n, cls, lab, inner) => `<div class="bgrp"><div class="row">${n ? rep(n, cls, inner) : '<span style="font-size:22px">—</span>'}</div><div>${lab}</div></div>`;

function inputsHTML(q) {

function readAnswer(q, choice) {

  const a = $('#a1')?.value.trim(), b = $('#a2')?.value.trim();

}

// Ask one question. done({ok, hint, tries, given}) — ok means right on the first try.
function ask(q, { icon, title }, done) {
  const an = annotate(q.zh); meetWords(an.ids);
  q.glossIds = an.ids;
  let tries = 0, hint = false, firstGiven = null, finished = false;
  openModal(`<h2><span class="ic">${icon}</span>${title}</h2>
    <div class="qzh zh">${an.html}<button class="say" id="bSay" title="Dengar">🔊</button></div>
    ${visualHTML(q.visual)}
    <div id="hintBox" class="hint hidden"></div>
    ${inputsHTML(q)}
    <div class="fb" id="fb"></div><div id="solBox"></div>
    <div class="btns"><button class="btn" id="bHint">💡 Petunjuk</button>${q.kind !== 'choice' ? '<button class="btn pri" id="bOk">✔ Hantar</button>' : ''}</div>`);
  const showHint = () => {
    if (!hint) { hint = true; }
    const gl = an.ids.map(id => `<span class="gl"><b class="zh">${WORD_BY_ID[id].zh}</b> ${WORD_BY_ID[id].py} = ${WORD_BY_ID[id].bm}</span>`).join('');
    $('#hintBox').innerHTML = `<div><b>BM:</b> ${q.bm}</div><div style="margin-top:4px">${q.hint}</div>${gl ? `<div style="margin-top:6px">${gl}</div>` : ''}`;
    $('#hintBox').classList.remove('hidden');
  };
  $('#bHint').onclick = showHint;
  $('#bSay').onclick = () => speak(q.zh);
  const finish = ok => {
    if (finished) return; finished = true;
    recordAttempt(q, { ok, hint, tries, given: firstGiven });
    done({ ok, hint, tries, given: firstGiven });
  };
  const submit = choice => {
    if (finished || tries >= 2) return;
    const r = readAnswer(q, choice); if (!r) return;
    if (firstGiven === null) firstGiven = r.text;
    tries++;
    if (checkAnswer(q, r)) {
      const fb = $('#fb'); fb.className = 'fb good'; fb.textContent = pick(['Betul! 对了！', 'Hebat! 很好！', 'Tepat! 太棒了！']);
      const okFirst = tries === 1;
      setTimeout(() => { closeModal(); finish(okFirst); }, 850);
      document.querySelectorAll('#modal input, #modal .btn').forEach(el => el.disabled = true);
      return;
    }
    const fb = $('#fb'); fb.className = 'fb bad'; fb.textContent = wrongMsg(q, r);
    $('#modal').classList.remove('shake'); void $('#modal').offsetWidth; $('#modal').classList.add('shake');
    if (tries === 1) { showHint(); const i = $('#a1'); if (i) { i.select(); i.focus(); } }
    else {
      $('#solBox').innerHTML = `<div class="sol">Jawapan: ${q.solution}</div>`;
      document.querySelectorAll('#modal input, #modal .choice .btn').forEach(el => el.disabled = true);
      $('#modal .btns').innerHTML = `<button class="btn pri" id="bCont">Faham, teruskan ➜</button>`;
      $('#bCont').onclick = () => { closeModal(); finish(false); };
      setTimeout(() => $('#bCont')?.focus(), 50);
    }
  };
  if ($('#bOk')) $('#bOk').onclick = () => submit();
  document.querySelectorAll('#modal [data-c]').forEach(b => b.onclick = () => submit(b.dataset.c));
  $('#modal').onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); if ($('#bCont')) $('#bCont').click(); else submit(); }
    if (e.key === ':' && e.target.id === 'a1') { e.preventDefault(); $('#a2')?.focus(); }
  };
  setTimeout(() => $('#a1')?.focus(), 30);
}

/* ---------- interactions ---------- */
const floats = [];

      const qty = Math.min(t.stock.wheat, 20); t.stock.wheat -= qty;

    });
  } else if (b.type === 'bakery') {
    if (b.end && absNow() >= b.end) { t.stock.bread += b.qty; floatText(b, `+${b.qty} 🍞`); toast(`🍞 ${b.qty} roti siap!`, 'good'); b.end = null; b.qty = 0; save(); return; }
    if (b.end) { toast(`🍞 Roti sedang dibakar. Siap pukul ${fmtClock(b.end % 1440)}.`); return; }

      else { const got = r.ok ? q.reward.coins : Math.ceil(q.reward.coins / 2); t.coins += got; P.stats.coins += got; if (t.dayStats) t.dayStats.coins += got; floatText(b, `+RM${got}`); }
    });
  } else {
    const w = WORD_BY_ID[TYPE_WORD[b.type]]; if (w) { playWord(w.id); meetWords([w.id]); toast(`<span class="zh" style="font-size:20px">${w.zh}</span> ${w.py} — ${w.bm}`); }

}
function deliver(b, q, r) {

  t.stock[item] -= need; t.delivered[item] += need;

  if (t.dayStats) { t.dayStats.orders++; t.dayStats.coins += pay; }

  else if (r.ok) toast(`😊 Keluarga gembira! +RM${pay}. Rumah ini sudah penuh — bina rumah baru!`, 'good');

function placeBuilding(type, x, y) {

/* ---------- game clock & events ---------- */
let paused = false, lastFrame = performance.now(), minuteAcc = 0, playAcc = 0;
function tick(dt) {
  if (!P || paused) return;
  const t = T();
  playAcc += dt;
  if (playAcc >= 15) { const k = todayKey(); P.minutes[k] = (P.minutes[k] || 0) + playAcc / 60; playAcc = 0; }
  if (modalOpen) return;
  minuteAcc += dt * GAME_MIN_PER_SEC;
  while (minuteAcc >= 1) {
    minuteAcc -= 1; t.minute++; t.t++;
    // orders
    const hasBakery = t.buildings.some(b => b.type === 'bakery'), hasMill = t.buildings.some(b => b.type === 'windmill');
    t.buildings.forEach(b => {
      if (b.type === 'house' && !b.order && t.t >= (b.nextOrderT || 0)) {
        const items = ['wheat']; if (hasMill) items.push('flour'); if (hasBakery) items.push('bread', 'bread', 'bread');
        b.order = pick(items);

    html = `<div class="zh">${ty.zh}</div><div>${w ? w.py + ' · ' : ''}${ty.bm}</div>`;
    if (b.type === 'farm') html += `<div>${farmHours(b) >= 1 ? `Sudah ${farmHours(b)} jam — klik untuk tuai` : 'Sedang tumbuh…'}</div>`;
    if (b.type === 'house') html += `<div>${b.res} orang${b.order ? ` · mahu ${ITEMS[b.order].bm} — klik!` : ''}</div>`;
    if ((b.type === 'windmill' || b.type === 'bakery') && b.end) html += `<div>${absNow() >= b.end ? 'Siap! Klik untuk ambil' : 'Siap pukul ' + fmtClock(b.end % 1440)}</div>`;
    if ((b.type === 'windmill' || b.type === 'bakery') && !b.end) html += `<div>Klik untuk mula</div>`;
  } else if (!owned(hoverTile.x, hoverTile.y) && hoverTile.x >= 0 && hoverTile.y >= 0 && hoverTile.x < MAP && hoverTile.y < MAP) {
    const px = Math.floor(hoverTile.x / PLOT), py = Math.floor(hoverTile.y / PLOT);
    html = plotBuyable(px, py) ? `<div class="zh">土地 tǔdì</div><div>Tanah untuk dijual — klik untuk kira harga</div>` : `<div>Hutan 🌲 — beli tanah di sebelahnya dulu</div>`;
  }
  if (!html) { tip.classList.add('hidden'); return; }
  tip.innerHTML = html; tip.classList.remove('hidden'); tip.style.left = Math.min(sx + 16, W - 270) + 'px'; tip.style.top = (sy + 16) + 'px';
}

/* ---------- screens ---------- */
function showProfiles() {
  P = null; paused = true;
  ['#hud', '#buildBar', '#goalChip'].forEach(s => $(s).classList.add('hidden'));
  const card = p => `<button class="pcard" data-p="${p.id}"><div class="av" style="background:${p.color}">${p.name[0]}</div><div class="nm">${p.name} <span class="zh">${p.zh}</span></div><div class="tt">${esc(titleOf(p))}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">Hari ini: ${Math.round(minutesToday(p))}/${S.settings.dailyMinutes} minit</div></button>`;
  $('#screen').innerHTML = `<div class="titleBox"><h1>🏘️ Bandar Ilmu</h1><div class="sub zh">知识城 · Bina bandar dengan matematik</div>
    <div class="profiles">${card(S.players.aflah)}${card(S.players.haidar)}</div>
    <div class="foot"><button class="btn" id="bAbah">👨 Abah</button></div></div>`;
  $('#screen').classList.remove('hidden');
  document.querySelectorAll('.pcard').forEach(el => el.onclick = () => startPlayer(el.dataset.p));
  $('#bAbah').onclick = abahGate;
}
function startPlayer(id) {
  const p = S.players[id];
  if (minutesToday(p) >= S.settings.dailyMinutes) { toast(`${p.name} sudah main ${S.settings.dailyMinutes} minit hari ini. Jumpa esok! 明天见！`, 'bad'); return; }
  P = p; $('#screen').classList.add('hidden');
  ['#hud', '#buildBar', '#goalChip'].forEach(s => $(s).classList.remove('hidden'));
  if (!T().dayStats) T().dayStats = { orders: 0, coins: 0, words: 0, asked: 0, correct: 0 };
  centerCam(); buildBarKey = ''; renderBuildBar(); paused = false;
  if (!P.intro) showHelp(true);
  else toast(`Selamat kembali, ${P.name}! 欢迎回来！`, 'good');
}
function showHelp(first) {
  openModal(`<h2><span class="ic">🏘️</span>${first ? `Selamat datang, ${P.name}!` : 'Cara main'}</h2>
    <p>Ini bandar anda dan adik-beradik. Bandar hanya membesar bila <b>anda kira dengan betul</b>.</p>
    <ul style="line-height:1.8">
      <li>🌾 <b>Ladang 农场</b> — klik bila ada 🌾 untuk tuai gandum.</li>
      <li>🏠 <b>Rumah 房子</b> — klik 📜 untuk baca pesanan dalam bahasa Cina, kemudian hantar jumlah yang betul.</li>
      <li>🌬️ <b>Kincir 风车</b> &amp; 🍞 <b>Kedai roti 面包店</b> — kira masa untuk kisar dan bakar.</li>
      <li>🚚 <b>Lori</b> di gudang — kira berapa barang sampai.</li>
      <li>🔒 <b>Tanah 土地</b> — kira harga untuk beli tanah baru.</li>
      <li>📖 Klik perkataan Cina bergaris untuk dengar sebutan. 💡 Petunjuk sentiasa ada.</li>
    </ul>
    <p class="muted">Tetikus: seret untuk gerak peta, roda untuk zum. Ruang (space) = rehat.</p>
    <div class="btns"><button class="btn pri" id="bGo">Jom main! 开始！</button></div>`);
  $('#bGo').onclick = () => { if (P) P.intro = true; save(); closeModal(); };
}
function showBook() {
  const n = WORDS.filter(w => P.words[w.id]).length;
  openModal(`<h2><span class="ic">📖</span>Buku Kata · 词语本 <span class="muted" style="font-size:15px;font-weight:400">${n}/${WORDS.length}</span></h2>
    <p class="muted">Kata yang anda jumpa dalam permainan. Klik untuk dengar.</p>
    <div class="wgrid">${WORDS.map(w => P.words[w.id] ? `<div class="wcard" data-w="${w.id}"><div class="zh">${w.zh}</div><div class="py">${w.py}</div><div class="bm">${w.bm}</div></div>` : `<div class="wcard locked"><div class="zh">？</div><div class="py">&nbsp;</div><div class="bm">belum jumpa</div></div>`).join('')}</div>
    <div class="btns"><button class="btn pri" id="bX">Tutup</button></div>`);
  document.querySelectorAll('.wcard[data-w]').forEach(el => el.onclick = () => playWord(el.dataset.w));
  $('#bX').onclick = closeModal;
}
function abahGate() {
  const has = !!S.settings.pin;
  openModal(`<h2><span class="ic">👨</span>Abah</h2><p>${has ? 'Masukkan PIN.' : 'Tetapkan PIN 4 digit untuk panel Abah.'}</p>
    <div class="ansRow"><input id="a1" type="password" inputmode="numeric" maxlength="6"></div><div class="fb bad" id="fb"></div>
    <div class="btns"><button class="btn" id="bX">Batal</button><button class="btn pri" id="bOk">OK</button></div>`);
  const go = () => { const v = $('#a1').value.trim(); if (!/^\d{4,6}$/.test(v)) { $('#fb').textContent = '4–6 digit.'; return; }
    if (!has) { S.settings.pin = v; save(); } else if (v !== S.settings.pin) { $('#fb').textContent = 'PIN salah.'; return; }
    showReport('aflah'); };
  $('#bOk').onclick = go; $('#bX').onclick = closeModal; $('#modal').onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('#a1').focus(), 30);
}
function showReport(pid) {
  const p = S.players[pid], logs = S.log.filter(l => l.p === pid);
  const rows = SKILLS.map(s => { const k = p.skills[s.id], acc = k.n ? Math.round(k.ok / k.n * 100) : null, col = k.mastery >= 0.75 ? '#2f8f5b' : k.mastery >= 0.5 ? '#d6a21e' : '#c0392b';
    return `<tr><td><b>${s.bm}</b> <span class="zh muted">${s.zh}</span><div class="muted" style="font-size:12px">${s.where}</div></td><td>${k.level}</td><td>${k.n}</td><td>${acc == null ? '—' : acc + '%'}</td><td>${k.hint}</td><td><span class="mbar"><i style="width:${k.mastery * 100}%;background:${col}"></i></span> ${Math.round(k.mastery * 100)}</td></tr>`; }).join('');
  const wrong = logs.filter(l => !l.ok).slice(-15).reverse().map(l => `<tr><td>${new Date(l.ts).toLocaleDateString('ms-MY')}</td><td>${esc(SKILL_BY_ID[l.skill]?.bm || l.skill)}</td><td class="zh" style="font-size:13px">${esc(l.q)}</td><td>${esc(l.given ?? '—')}</td><td><b>${esc(l.ans)}</b></td></tr>`).join('');
  const mins = Object.entries(p.minutes).slice(-7).map(([d, m]) => `${d.slice(5)}: ${Math.round(m)} min`).join(' · ');
  openModal(`<h2><span class="ic">📊</span>Laporan Abah</h2>
    <div class="tabs">${Object.values(S.players).map(x => `<button class="btn ${x.id === pid ? 'on' : ''}" data-t="${x.id}">${x.name}</button>`).join('')}</div>
    <p>${esc(titleOf(p))} · ${p.stats.correct}/${p.stats.asked} betul cubaan pertama · ${Object.keys(p.words).length}/${WORDS.length} kata Cina · ${p.stats.orders} pesanan<br><span class="muted">Minit main: ${mins || 'belum ada'}</span></p>
    <table class="rep"><tr><th>Kemahiran</th><th>Tahap</th><th>Soalan</th><th>Betul</th><th>💡</th><th>Penguasaan</th></tr>${rows}</table>
    <h3 style="margin:8px 0 4px">Kesilapan terkini</h3>
    ${wrong ? `<table class="rep"><tr><th>Tarikh</th><th>Kemahiran</th><th>Soalan</th><th>Dia jawab</th><th>Betul</th></tr>${wrong}</table>` : '<p class="muted">Tiada kesilapan lagi.</p>'}
    <h3 style="margin:8px 0 4px">Tetapan</h3>
    <div class="ansRow" style="font-size:15px">Had main sehari <input id="lim" class="sm" value="${S.settings.dailyMinutes}"> minit
      <span style="margin-left:12px">Trek ${p.name}:</span> <select id="trk" style="font:inherit;padding:4px"><option value="muda" ${p.track === 'muda' ? 'selected' : ''}>Muda (Tahun 1–2)</option><option value="besar" ${p.track === 'besar' ? 'selected' : ''}>Besar (Tahun 3+)</option></select></div>
    ${storageOk ? '' : '<p class="fb bad">Simpanan pelayar disekat — kemajuan tidak disimpan. Guna Eksport.</p>'}
    <div class="btns"><button class="btn" id="bExp">⬇ Eksport JSON</button><button class="btn" id="bImp">⬆ Import</button><button class="btn" id="bReset">↺ Mula semula bandar</button><button class="btn pri" id="bX">Simpan & tutup</button></div>
    <input type="file" id="fImp" accept=".json" class="hidden">`);
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { saveSettings(p); showReport(b.dataset.t); });
  $('#bX').onclick = () => { saveSettings(p); closeModal(); showProfiles(); };
  $('#bExp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bandar-ilmu-${todayKey()}.json`; a.click(); };
  $('#bImp').onclick = () => $('#fImp').click();
  $('#fImp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const d = JSON.parse(txt); if (d.v !== 1 || !d.town) throw 0; S = d; save(); terrainDirty = true; toast('Diimport.', 'good'); showReport(pid); } catch (er) { toast('Fail tidak sah.', 'bad'); } }); };
  $('#bReset').onclick = () => { if (confirm('Mula semula bandar? Kemajuan kemahiran anak-anak KEKAL; hanya bandar dikosongkan.')) { S.town = newTown(); terrainDirty = true; save(); toast('Bandar baru.', 'good'); } };
}
function saveSettings(p) {
  const lim = parseInt($('#lim')?.value, 10); if (lim >= 5 && lim <= 300) S.settings.dailyMinutes = lim;
  const trk = $('#trk')?.value; if (trk && trk !== p.track) { p.track = trk; SKILLS.forEach(s => { p.skills[s.id].level = Math.max(p.skills[s.id].level, START_LEVEL[trk][s.id]); if (trk === 'muda') p.skills[s.id].level = Math.min(p.skills[s.id].level, 2); }); }
  save();
}

$('#bBook').onclick = () => P && showBook();
$('#bSwitch').onclick = () => { save(); showProfiles(); };
$('#bPause').onclick = () => { paused = !paused; };
$('#bHelp').onclick = () => P && showHelp(false);
$('#goalChip').onclick = () => toast('Siapkan matlamat bab untuk hadiah RM100 dan bab baru!');

/* ---------- main loop ---------- */
let hudAt = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (P && !modalOpen) {
    const sp = 500 * dt / cam.z;
    if (keys['arrowleft'] || keys['a']) cam.x -= sp; if (keys['arrowright'] || keys['d']) cam.x += sp;
    if (keys['arrowup'] || keys['w']) cam.y -= sp; if (keys['arrowdown'] || keys['s']) cam.y += sp;
    clampCam();
  }
  tick(dt); updateVillagers(dt);
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].life -= dt; floats[i].y -= 30 * dt; if (floats[i].life <= 0) floats.splice(i, 1); }
  render(now); if (P && now - hudAt > 200) { hudAt = now; renderHUD(); renderBuildBar(); }
  requestAnimationFrame(frame);
}
load(); centerCam(); showProfiles(); requestAnimationFrame(frame);
window.BI = { get S() { return S; }, get P() { return P; }, T, interact, buyPlot, placeBuilding, qFarm, qWindmill, qBakeUnits, qBakeDur, qLorry, qOrder, qPlot, zhNum, tick, startPlayer };
</script>
